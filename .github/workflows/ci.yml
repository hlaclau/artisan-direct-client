name: CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            task: lint
          - name: Format
            task: fmt:check
          - name: Typecheck
            task: typecheck
          - name: Test
            task: test
          - name: Build
            task: build
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - run: mise run ${{ matrix.task }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      LEFTHOOK: 0
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - name: Run tests with coverage
        run: |
          set -o pipefail
          mise run test:coverage | tee coverage.txt
      - name: Publish coverage to job summary
        if: always()
        run: |
          {
            echo '## Code coverage'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post coverage to pull request
        if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- coverage-report -->'
          {
            echo "$marker"
            echo '## Code coverage'
            echo '```'
            sed 's/\x1b\[[0-9;]*m//g' coverage.txt
            echo '```'
          } > comment.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq "map(select(.body | startswith(\"$marker\"))) | first | .id // empty" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@comment.md
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@comment.md
          fi
